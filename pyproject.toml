[project]
name = "sb-shaping-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jax[cpu]",
    "equinox",
    "diffrax",
    "optax",
    "mujoco",
    "mujoco-mjx",
    "control",
    "matplotlib",
    "numpy",
    "scipy",
    "cvxpy>=1.9.1",
    "mosek>=11.2.1",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartpole"]
